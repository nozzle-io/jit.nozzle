name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: cmake -B build -DJIT_NOZZLE_BUILD_TESTS=ON && cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Verify externals
        run: |
          for ext in jit.nozzle.send jit.nozzle.receive jit.gl.nozzle.send jit.gl.nozzle.receive; do
            binary="externals/${ext}.mxo/Contents/MacOS/${ext}"
            if [ ! -f "$binary" ]; then
              echo "Missing: $binary"
              exit 1
            fi
            archs=$(lipo -info "$binary" 2>&1)
            echo "$archs"
            echo "$archs" | grep -q "x86_64 arm64" || { echo "Not universal: $ext"; exit 1; }
          done

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: externals/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DJIT_NOZZLE_BUILD_TESTS=ON && cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Verify externals
        shell: bash
        run: |
          for ext in jit.nozzle.send jit.nozzle.receive jit.gl.nozzle.send jit.gl.nozzle.receive; do
            binary="externals/${ext}.mxe64"
            if [ ! -f "$binary" ]; then
              echo "Missing: $binary"
              exit 1
            fi
            echo "OK: $binary"
          done

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: externals/

  package:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS externals
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: dist/${{ github.event.repository.name }}/externals/

      - name: Download Windows externals
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: dist/${{ github.event.repository.name }}/externals/

      - name: Assemble package
        run: |
          NAME="${{ github.event.repository.name }}"
          cp package-info.json "dist/$NAME/" 2>/dev/null || true
          cp LICENSE "dist/$NAME/" 2>/dev/null || true
          cp README.md "dist/$NAME/" 2>/dev/null || true
          cp -r help "dist/$NAME/" 2>/dev/null || true
          cp -r extra "dist/$NAME/" 2>/dev/null || true
          cp -r patchers "dist/$NAME/" 2>/dev/null || true

      - name: Create archive
        run: |
          cd dist
          zip -r "${{ github.event.repository.name }}.zip" "${{ github.event.repository.name }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-latest
          path: dist/*.zip

      - name: Upload to Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: false
          files: dist/*.zip

      - name: Upload to Versioned Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
